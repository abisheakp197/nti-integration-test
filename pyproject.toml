[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nti-integration-test"
version = "0.1.0"
description = "Ecosystem integration test suite for Neural Trust Infrastructure (NTI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ube-foundation>=0.1.7",
    "nti-scanner>=0.1.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
]

[project.optional-dependencies]
# Note: nti-attack, nti-benchmark, and nti-badge are currently not publishable/installable from PyPI.
# They are omitted from main dependencies so `pip install -e .` succeeds against real PyPI packages.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
