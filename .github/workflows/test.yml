name: NTI Integration Test Suite

on:
  push:
    branches: [ main, "crucible/*" ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"  # Run daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . ruff mypy types-requests pytest-socket

    - name: Run Ruff Linter
      run: |
        ruff check .

    - name: Run Mypy Type Checker
      run: |
        mypy --strict tests/

    - name: Run Integration, Real-World, and Chaos Test Suites
      run: |
        pytest -n auto --random-order -v
